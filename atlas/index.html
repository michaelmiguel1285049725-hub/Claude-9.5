<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f9">
<title>领域学习地图</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>/* 首帧前套用手动主题，避免闪烁 */(function(){try{var t=JSON.parse(localStorage.getItem('atlas.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" id="brand">
      <h1 id="title">领域学习地图</h1>
      <span class="draft" id="draft" hidden></span>
    </div>
    <div class="seg" role="group" aria-label="视角" id="views">
      <button type="button" data-view="network" aria-pressed="true">关系网 <kbd>1</kbd></button>
      <button type="button" data-view="maturity" aria-pressed="false">成熟度 <kbd>2</kbd></button>
      <button type="button" data-view="timeline" aria-pressed="false">时间线 <kbd>3</kbd></button>
    </div>
    <button type="button" class="chip" id="simpleToggle" aria-pressed="false" hidden title="只画研究线气泡和汇总连线">简化为研究线</button>
    <div class="tools">
      <div class="search-wrap"><input id="search" type="search" placeholder="搜索编号 / 名称（/）" autocomplete="off" spellcheck="false" aria-label="搜索节点"></div>
      <button type="button" class="chip prominent" id="sourceOnly" aria-pressed="false" title="隐藏所有 Claude 加工的关系（带空心圆的线）">只看有文献来源</button>
      <button type="button" class="icon-btn" id="filtersBtn" aria-expanded="false" aria-controls="drawer">筛选<span class="badge" id="filtersBadge" hidden></span></button>
      <button type="button" class="icon-btn" id="gapsBtn" aria-pressed="false" title="列出全部空缺问题">空缺</button>
      <button type="button" class="icon-btn" id="legendBtn" aria-expanded="false" aria-controls="legendPop">图例</button>
      <button type="button" class="icon-btn ring-btn" id="progressBtn" aria-expanded="false" aria-controls="progressPop" title="学习进度">
        <svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle class="ring-bg" cx="10" cy="10" r="8"/><circle class="ring-fg" cx="10" cy="10" r="8"/></svg><span id="progressText">0/0</span>
      </button>
      <button type="button" class="icon-btn" id="helpBtn" title="操作提示" aria-label="操作提示">?</button>
      <button type="button" class="icon-btn" id="theme" title="切换浅色 / 深色" aria-label="切换主题">◐</button>
    </div>
  </header>
  <details id="banner" hidden open></details>
  <div id="drawer" class="popover" hidden role="dialog" aria-label="筛选"></div>
  <div id="legendPop" class="popover" hidden role="dialog" aria-label="图例"><div class="pop-head">图例 <span class="pop-sub">只列当前画面里出现的编码</span></div><div class="body" id="legendBody"></div></div>
  <div id="progressPop" class="popover" hidden role="dialog" aria-label="学习进度"></div>
  <div id="main">
    <div id="stage">
      <svg id="canvas" data-level="2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs id="defs"></defs>
        <g id="world"></g>
      </svg>
      <svg id="maturity" class="viewsvg" data-badges="1" hidden xmlns="http://www.w3.org/2000/svg"><g class="world"></g></svg>
      <svg id="timeline" class="viewsvg" data-badges="1" hidden xmlns="http://www.w3.org/2000/svg"><g class="world"></g></svg>
      <div id="summary" hidden></div>
      <div id="viewTools" hidden></div>
      <div class="stage-tools">
        <span class="zoom-readout" data-zoom-readout>100%</span>
        <button type="button" class="icon-btn" id="fit" title="适配全部">适配全部</button>
        <button type="button" class="icon-btn" id="back" title="回到选中节点" disabled>回到选中</button>
      </div>
      <div id="hint" hidden>拖动平移 · 滚轮缩放 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换视角 · <kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 返回</div>
    </div>
    <aside id="panel" aria-live="polite" hidden>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
