<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习地图</title>
<script>/* 首帧前套用保存的深浅色，避免闪烁 */try{var t=JSON.parse(localStorage.getItem('atlas._global.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- 全局共用的 SVG 定义（箭头 marker 等）：不能用 display:none，否则别的 SVG 引用不到 -->
<svg id="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs></defs></svg>
<div id="app">
  <!-- 顶栏只有一行 -->
  <header class="top">
    <div class="brand" id="brand" tabindex="0">
      <h1 id="title">学习地图</h1>
      <span class="draft" id="draft" hidden></span>
    </div>
    <div class="seg" role="group" aria-label="视角">
      <button type="button" data-view="network" aria-pressed="true" title="关系网（键盘 1）">关系网</button>
      <button type="button" data-view="maturity" aria-pressed="false" title="成熟度地图（键盘 2）">成熟度</button>
      <button type="button" data-view="timeline" aria-pressed="false" title="时间线（键盘 3）">时间线</button>
    </div>
    <div class="top-right">
      <div class="searchbox">
        <input type="search" id="search" placeholder="搜索编号 / 名称（/）" autocomplete="off" spellcheck="false" aria-label="搜索节点" aria-controls="searchList">
        <ul id="searchList" role="listbox" hidden></ul>
      </div>
      <button type="button" class="tbtn" id="pathBtn" aria-pressed="false" title="找两个节点之间的关系链">找路径</button>
      <button type="button" class="tbtn" id="filterBtn" aria-expanded="false" aria-controls="filterDrawer">筛选<span class="badge" id="filterCount" hidden></span></button>
      <button type="button" class="tbtn" id="gapBtn" aria-pressed="false" title="列出全部空缺问题">空缺</button>
      <label class="tswitch" title="隐藏所有 Claude 加工的关系（中点带空心圆的线）"><input type="checkbox" id="sourceOnly"><span>只看文献来源</span></label>
      <button type="button" class="tbtn" id="legendBtn" aria-expanded="false" aria-controls="legend">图例</button>
      <button type="button" class="tbtn icon" id="themeBtn" aria-label="深浅色"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8 A6.2 6.2 0 0 1 8 14.2 Z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div id="issues" role="alert" hidden></div>
  <main id="stage">
    <div id="views">
      <div class="view" data-view="network"></div>
      <div class="view" data-view="maturity" hidden></div>
      <div class="view" data-view="timeline" hidden></div>
    </div>
    <div class="canvas-top-left">
      <nav id="trail" aria-label="路径导航" hidden></nav>
      <div class="ctl-row">
        <button type="button" class="btn" id="backBtn" title="返回研究线（Esc）" hidden>‹ 回到研究线</button>
        <button type="button" id="filterSummary" hidden></button>
      </div>
    </div>
    <div class="canvas-tools">
      <span class="view-tools" data-for="network" hidden></span>
      <span class="view-tools" data-for="maturity" hidden></span>
      <span class="view-tools" data-for="timeline" hidden></span>
      <button type="button" class="btn zoom-only" id="focusBtn" title="缩放到当前选中的对象" disabled>回到选中</button>
      <button type="button" class="btn zoom-only" id="fitBtn" title="缩放到能看到全部节点">适配全部</button>
    </div>
    <!-- 覆盖在画布上的抽屉与浮层 -->
    <nav id="filterDrawer" class="drawer-top" aria-label="筛选" hidden></nav>
    <aside id="legend" aria-label="图例" hidden></aside>
    <aside id="panel" aria-label="详情面板" aria-hidden="true">
      <div class="p-head">
        <button type="button" class="icon" data-act="close" title="关闭（Esc）" aria-label="关闭">×</button>
      </div>
      <div class="p-body"></div>
    </aside>
    <div id="toast" role="status" hidden></div>
  </main>
</div>
</body>
</html>
