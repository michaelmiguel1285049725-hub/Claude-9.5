<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习地图</title>
<script>/* 首帧前套用保存的深浅色，避免闪烁 */try{var t=JSON.parse(localStorage.getItem('atlas._global.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- 全局共用的 SVG 定义（箭头 marker 等）：不能用 display:none，否则别的 SVG 引用不到 -->
<svg id="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs></defs></svg>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1><span id="title">学习地图</span><span class="ver" id="ver" hidden></span><span class="draft" id="draft" hidden tabindex="0"></span></h1>
      <p id="subtitle"></p>
    </div>
    <div class="seg" role="group" aria-label="视角">
      <button type="button" data-view="network" aria-pressed="true" title="关系网（键盘 1）">关系网</button>
      <button type="button" data-view="maturity" aria-pressed="false" title="成熟度地图（键盘 2）">成熟度</button>
      <button type="button" data-view="timeline" aria-pressed="false" title="时间线（键盘 3）">时间线</button>
    </div>
    <div class="searchbox">
      <input type="search" id="search" placeholder="搜索编号 / 名称　按 / 聚焦" autocomplete="off" spellcheck="false" aria-label="搜索节点" aria-controls="searchList">
      <ul id="searchList" role="listbox" hidden></ul>
    </div>
    <div class="top-actions">
      <button type="button" class="btn" id="themeBtn"></button>
    </div>
  </header>
  <nav id="filterbar" aria-label="筛选"></nav>
  <div id="issues" role="alert" hidden></div>
  <div id="main">
    <main id="stage">
      <div id="views">
        <div class="view" data-view="network"></div>
        <div class="view" data-view="maturity" hidden></div>
        <div class="view" data-view="timeline" hidden></div>
      </div>
      <button type="button" id="filterSummary" hidden></button>
      <div class="canvas-tools">
        <span class="view-tools" data-for="maturity" hidden></span>
        <span class="view-tools" data-for="timeline" hidden></span>
        <button type="button" class="btn" id="pathBtn" aria-pressed="false" title="依次点击两个节点，找它们之间的关系链">找路径</button>
        <button type="button" class="btn" id="focusBtn" title="缩放到当前选中的对象" disabled>回到选中</button>
        <button type="button" class="btn" id="fitBtn" title="缩放到能看到全部节点">适配全部</button>
        <span class="sep net-only"></span>
        <button type="button" class="btn net-only" id="resetLayoutBtn" title="清除拖动过的位置，回到自动布局">重置布局</button>
        <button type="button" class="btn net-only" id="exportLayoutBtn" title="把当前布局下载为 layout.json">导出布局</button>
      </div>
      <details id="legend" open></details>
      <div id="toast" role="status" hidden></div>
    </main>
    <aside id="panel" aria-label="详情面板">
      <button type="button" id="panelTab" title="展开 / 收起面板" aria-label="展开或收起面板"></button>
      <div class="p-head">
        <button type="button" class="icon" data-act="collapse" title="收起面板" aria-label="收起面板">»</button>
        <button type="button" class="icon" data-act="close" title="关闭（Esc）" aria-label="关闭">×</button>
      </div>
      <div class="p-body"></div>
    </aside>
  </div>
</div>
</body>
</html>
